<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes Accords Local</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #f9f9f9;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #222;
        }
        .search-container {
            text-align: center;
            margin: 30px 0;
        }
        input[type="text"] {
            width: 70%;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .song-list {
            list-style: none;
            padding: 0;
        }
        .song-list li {
            padding: 12px;
            background: white;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
        }
        .song-list li:hover {
            background: #f0f0f0;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
        }
        pre {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-x: auto;
            display: none; /* caché au début */
        }
        .back-button {
            margin: 15px 0;
            padding: 8px 16px;
        }
    </style>
</head>
<body>

    <h1>🎸 Mes Accords Local</h1>

    <!-- Page d'accueil avec recherche -->
    <div id="home">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Rechercher une chanson ou un artiste..." onkeyup="searchSongs()">
        </div>
        <ul class="song-list" id="songList"></ul>
    </div>

    <!-- Page chanson -->
    <div id="songPage" style="display: none;">
        <button class="back-button" onclick="goBack()">← Retour à l'accueil</button>
        <div class="controls">
            <button onclick="transpose(1)">+1 demi-ton</button>
            <button onclick="transpose(-1)">-1 demi-ton</button>
        </div>
        <pre id="chords"></pre>
    </div>

    <script>
        // === Liste des chansons (tu peux en ajouter facilement) ===
        const songs = [
            {
                id: 1,
                title: "La Corrida",
                artist: "Francis Cabrel",
                content: `Dm                F
Depuis le temps que je patiente
C                 Bb
Dans cette chambre noire
Dm                F
J'entends qu'on s'amuse et qu'on chante
C                 Bb
Au bout du couloir

Dm                F
Quelqu'un a touché le verrou
C                 Bb
Et j'ai plongé vers le grand jour
Dm                F
J'ai vu les fanfares, les barrières
C                 Bb
Et les gens autour`
            },
            {
                id: 2,
                title: "Gardien de nuit",
                artist: "Francis Cabrel",
                content: `Gm                Bb
Je garde les pieds sur terre
F                 Eb
Je garde la tête froide
Gm                Bb
Je garde un revolver
F                 Eb
Jusque dans ma baignoire

Gm                Bb
Je garde un œil ouvert
F                 Eb
Quand je suis dans le noir
Gm                Bb
Je suis le gardien de nuit
F                 Eb
Et je veille sur toi`
            },
            {
                id: 3,
                title: "High Hopes",
                artist: "Pink Floyd",
                content: `Cm                Cm7
Beyond the horizon
Ab
Of the place we lived when we were young
Cm                Cm7
In a world of magnets
Ab
And miracles

Cm                Cm7
Our thoughts strayed constantly
Ab
And without boundary`
            }
        ];

        let currentSong = null;

        // Afficher la liste des chansons
        function displaySongs(filteredSongs) {
            const list = document.getElementById("songList");
            list.innerHTML = "";
            
            filteredSongs.forEach(song => {
                const li = document.createElement("li");
                li.textContent = `${song.title} - ${song.artist}`;
                li.onclick = () => showSong(song);
                list.appendChild(li);
            });
        }

        // Recherche en temps réel
        function searchSongs() {
            const term = document.getElementById("searchInput").value.toLowerCase();
            const filtered = songs.filter(song => 
                song.title.toLowerCase().includes(term) || 
                song.artist.toLowerCase().includes(term)
            );
            displaySongs(filtered);
        }

        // Afficher une chanson
        function showSong(song) {
            currentSong = song;
            document.getElementById("home").style.display = "none";
            document.getElementById("songPage").style.display = "block";
            
            document.getElementById("chords").innerHTML = 
                `<strong>${song.title} - ${song.artist}</strong>\n\n` + song.content;
            document.getElementById("chords").style.display = "block";
        }

        // Retour à l'accueil
        function goBack() {
            document.getElementById("songPage").style.display = "none";
            document.getElementById("home").style.display = "block";
            document.getElementById("searchInput").focus();
        }

        // Fonction de transposition
        function transpose(semitones) {
            if (!currentSong) return;
            
            const pre = document.getElementById("chords");
            let text = pre.innerHTML;
            
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            
            text = text.replace(/\b([A-G]#?)(m|7|sus4|dim|maj|aug|b)?\b/g, function(match) {
                let base = match.match(/^[A-G]#?/)[0];
                let suffix = match.slice(base.length);
                let index = notes.indexOf(base);
                if (index === -1) return match;
                let newIndex = (index + semitones + 12) % 12;
                return notes[newIndex] + suffix;
            });
            
            pre.innerHTML = text;
        }

        // Au chargement, afficher toutes les chansons
        window.onload = () => {
            displaySongs(songs);
        };
    </script>

</body>
</html>
